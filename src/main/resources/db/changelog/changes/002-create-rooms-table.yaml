databaseChangeLog:
  - changeSet:
      id: 002-create-rooms-table
      author: lubskiy.va
      changes:
        - createTable:
            tableName: rooms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: floor
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: has_projector
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: has_whiteboard
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: rooms
            columnNames: name, floor
            constraintName: uk_rooms_name_floor